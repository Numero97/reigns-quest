<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reign's Quest" />
  <meta name="theme-color" content="#bcd7f5" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Reign's Quest</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #1c2a3a; overflow: hidden; overscroll-behavior: none; }
    * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; height: 100dvh; width: 100vw;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box; touch-action: none; display: flex; align-items: center; justify-content: center; }
    #game canvas { touch-action: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
